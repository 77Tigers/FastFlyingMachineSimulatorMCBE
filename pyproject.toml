[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fastflyer"
version = "0.1.0"
description = "Storage and Python editing tools for Bedrock flying machines"
requires-python = ">=3.10"

[project.optional-dependencies]
# Offline search scripts; the editor and native contract solver do not need them.
research = ["ortools", "numpy", "scipy"]

[tool.setuptools.packages.find]
include = ["fastflyer*"]
